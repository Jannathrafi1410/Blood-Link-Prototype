<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" fill="none" class="w-full h-full">
  <defs>
    <!-- Rich Crimson to Coral Gradient -->
    <linearGradient id="dropGrad" x1="50" y1="10" x2="190" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="45%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <!-- Soft Highlights -->
    <linearGradient id="highlightGrad" x1="60" y1="40" x2="100" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="blushGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDA4AF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FDA4AF" stop-opacity="0" />
    </radialGradient>
    <!-- Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7F1D1D" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Ambient Ground Shadow -->
  <ellipse cx="120" cy="265" rx="68" ry="12" fill="#0F172A" opacity="0.12" />

  <!-- Main Blood Drop Body with Filter -->
  <path d="M 120 18
           C 142 62, 204 140, 204 186
           C 204 232, 166 262, 120 262
           C 74 262, 36 232, 36 186
           C 36 140, 98 62, 120 18 Z"
        fill="url(#dropGrad)"
        filter="url(#softShadow)" />

  <!-- Glossy Highlight / Sheen Curve -->
  <path d="M 115 36
           C 100 68, 54 135, 54 182
           C 54 204, 62 222, 74 235
           C 66 220, 62 198, 62 180
           C 62 135, 98 80, 115 36 Z"
        fill="url(#highlightGrad)" />

  <!-- Little Sparkle Light on Crest -->
  <ellipse cx="88" cy="100" rx="9" ry="16" transform="rotate(-26 88 100)" fill="#FFFFFF" opacity="0.45" />

  <!-- Happy Friendly Face -->
  <!-- Left Eye -->
  <circle cx="94" cy="162" r="10" fill="#1E293B" />
  <circle cx="91" cy="159" r="3.5" fill="#FFFFFF" />
  <circle cx="96" cy="164" r="1.5" fill="#FFFFFF" />

  <!-- Right Eye -->
  <circle cx="146" cy="162" r="10" fill="#1E293B" />
  <circle cx="143" cy="159" r="3.5" fill="#FFFFFF" />
  <circle cx="148" cy="164" r="1.5" fill="#FFFFFF" />

  <!-- Rosy Cheeks -->
  <circle cx="78" cy="174" r="9" fill="url(#blushGrad)" />
  <circle cx="162" cy="174" r="9" fill="url(#blushGrad)" />

  <!-- Sweet Cheerful Smile -->
  <path d="M 107 182 C 114 195, 126 195, 133 182" stroke="#1E293B" stroke-width="4.5" stroke-linecap="round" fill="none" />

  <!-- Medical Cross White Shield Badge with Emerald Core -->
  <g transform="translate(120, 222)">
    <circle cx="0" cy="0" r="19" fill="#FFFFFF" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.15))" />
    <path d="M -4 -11 L 4 -11 L 4 -4 L 11 -4 L 11 4 L 4 4 L 4 11 L -4 11 L -4 4 L -11 4 L -11 -4 L -4 -4 Z" fill="#DC2626" />
  </g>
</svg>
